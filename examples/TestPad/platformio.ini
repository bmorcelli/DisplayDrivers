; TestPad — one env per backend, all building the same sketch.
;
; The point is coverage, not a working panel: each env picks a device profile
; that suits its graphics library, and every call the library publishes is made
; in src/main.cpp. If an env stops compiling, an API promise was broken.
;
;   pio run            build them all
;   pio run -e ardgfx  build one

[platformio]
default_envs = ardgfx, lovyangfx, tft_espi, m5gfx, epd_painter, gxepd2, dummy

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board = esp32-p4-evboard
lib_deps = symlink://../..
lib_ldf_mode = chain+
build_flags = -DCORE_DEBUG_LEVEL=0

; ---------------------------------------------------------------------------
; Arduino_GFX — the default backend. Driven here on the DSI panel of the
; board this example targets.
; ---------------------------------------------------------------------------
[env:ardgfx]
build_flags =
	${env.build_flags}
	-DDISPLAY_DEVICE_LILYGO_T_DISPLAY_P4
	-I".pio/libdeps/ardgfx/GFX Library for Arduino/src"
lib_deps =
	${env.lib_deps}
	https://github.com/moononournation/Arduino_GFX.git#2ef1b8f958818b4cba66728df4c2f78bb77f0321

; ---------------------------------------------------------------------------
; LovyanGFX — parallel 8-bit ST7789, which is what LovyanGFX is wired up for
; in this wrapper. ESP32 only: LovyanGFX has no ESP32-P4 target.
; ---------------------------------------------------------------------------
[env:lovyangfx]
board = esp32dev
build_flags =
	${env.build_flags}
	-DDISPLAY_DEVICE_CYD_2432S022C
	-DUSE_LOVYANGFX=1
	-I.pio/libdeps/lovyangfx/LovyanGFX/src
lib_deps =
	${env.lib_deps}
	lovyan03/LovyanGFX @ ^1.2.7

; ---------------------------------------------------------------------------
; TFT_eSPI — SPI ST7789. ESP32-S3: TFT_eSPI has no ESP32-P4 target.
; ---------------------------------------------------------------------------
[env:tft_espi]
board = esp32-s3-devkitc-1
build_flags =
	${env.build_flags}
	-DDISPLAY_DEVICE_M5STACK_CARDPUTER
	-DUSE_TFT_ESPI=1
	-I.pio/libdeps/tft_espi/TFT_eSPI
lib_deps =
	${env.lib_deps}
	bodmer/TFT_eSPI @ ^2.5.43

; ---------------------------------------------------------------------------
; M5Unified — the Tab5 is the ESP32-P4 M5Stack unit, so it fits this board.
; ---------------------------------------------------------------------------
[env:m5gfx]
build_flags =
	${env.build_flags}
	-DDISPLAY_DEVICE_M5STACK_TAB5
	-DUSE_M5GFX=1
	-I.pio/libdeps/m5gfx/M5Unified/src
	-I.pio/libdeps/m5gfx/M5GFX/src
lib_deps =
	${env.lib_deps}
	m5stack/M5Unified @ ^0.2.11
	m5stack/M5GFX @ ^0.2.18

; ---------------------------------------------------------------------------
; EPD Painter — parallel e-paper. ESP32-S3: the presets are S3 boards.
; ---------------------------------------------------------------------------
[env:epd_painter]
board = esp32-s3-devkitc-1
build_flags =
	${env.build_flags}
	-DDISPLAY_DEVICE_LILYGO_T5_EPAPER_S3_PRO
	-DUSE_EPD_PAINTER=1
	-I".pio/libdeps/epd_painter/EPD Painter/src"
	-I".pio/libdeps/epd_painter/Adafruit GFX Library"
	-I".pio/libdeps/epd_painter/Adafruit BusIO"
lib_deps =
	${env.lib_deps}
	https://github.com/tonywestonuk/EPD_Painter
	adafruit/Adafruit GFX Library @ ^1.12.1

; ---------------------------------------------------------------------------
; GxEPD2 — SPI e-paper. Note this one is GPL-3.0; see the Licensing section of
; the library README before shipping anything built with it.
; ---------------------------------------------------------------------------
[env:gxepd2]
board = esp32-s3-devkitc-1
build_flags =
	${env.build_flags}
	-DDISPLAY_DEVICE_LILYGO_T_DECK_PRO
	-DUSE_GXEPD2=1
	-I.pio/libdeps/gxepd2/GxEPD2/src
	-I".pio/libdeps/gxepd2/Adafruit GFX Library"
	-I".pio/libdeps/gxepd2/Adafruit BusIO"
lib_deps =
	${env.lib_deps}
	zinggjm/GxEPD2 @ ^1.6.4
	adafruit/Adafruit GFX Library @ ^1.12.1

; ---------------------------------------------------------------------------
; Headless — no graphics library at all, every call a no-op.
; ---------------------------------------------------------------------------
[env:dummy]
build_flags =
	${env.build_flags}
	-DDISPLAY_DEVICE_HEADLESS_ESP32_4MB
	-DUSE_DUMMY_TFT=1
