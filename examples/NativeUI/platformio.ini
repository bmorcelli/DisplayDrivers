; NativeUI — DisplayDrivers on the desktop.
;
; Opens an SDL2 window and drives it through the same tft_display/tft_sprite
; API every board uses, via a new backend (USE_NATIVE_SDL) that needs no
; Arduino core at all. Arrow keys are a 5-button nav pad; a-z/0-9/space/enter/
; backspace/esc are scanned in as a HAS_KEYBOARD-style emulation. See src/main.cpp
; and the README next to this file.
;
;   pio run -e native -t upload    build and run the window
;
; Prerequisites:
;   Linux/WSL: sudo apt install -y build-essential libsdl2-dev
;   Windows:   MSYS2 (ucrt64 gcc) + SDL2 "devel-mingw" — see README.md
;   macOS:     xcode-select --install ; brew install sdl2

[platformio]
default_envs = native

[env:native]
platform = native
build_type = debug
build_flags =
	-O0 -xc++ -std=c++14
	-lSDL2
	-DUSE_NATIVE_SDL=1
	; DisplayDrivers is pulled in here via a symlink to its own parent folder
	; (this example lives inside the library it's testing), which throws off
	; PlatformIO's dependency finder on `platform = native`: it fetches
	; LovyanGFX but doesn't add its headers to DisplayDrivers' own include
	; path. Spelling it out here is the fix.
	-I.pio/libdeps/native/LovyanGFX/src
lib_deps =
	symlink://../..
	lovyan03/LovyanGFX @ ^1.2.7

; macOS (Homebrew SDL2, Intel). Use native_mac_arm below on Apple Silicon.
[env:native_mac]
extends = env:native
build_flags =
	${env:native.build_flags}
	-I"/usr/local/include/SDL2"
	-L"/usr/local/lib"

[env:native_mac_arm]
extends = env:native
build_flags =
	${env:native.build_flags}
	-arch arm64
	-I"${sysenv.HOMEBREW_PREFIX}/include/SDL2"
	-L"${sysenv.HOMEBREW_PREFIX}/lib"
