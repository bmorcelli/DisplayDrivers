name=DisplayDrivers
version=0.0.2
author=bmorcelli
maintainer=bmorcelli <https://github.com/bmorcelli>
sentence=One display API over Arduino_GFX, LovyanGFX, TFT_eSPI, M5GFX, EPD Painter and GxEPD2, plus a headless no-op backend.
paragraph=Pick a backend with a USE_* build flag and the same tft_display / tft_sprite calls drive an LCD, an OLED, an AMOLED, an RGB/DSI panel, an e-paper - or nothing at all, on boards with no display (USE_DUMMY_TFT). Panels are described with plain TFT_* macros, so swapping graphics libraries is a build-flag change instead of a rewrite. The backend library itself (Arduino_GFX, LovyanGFX, TFT_eSPI, M5Unified, EPD Painter or GxEPD2) has to be installed separately; the headless backend needs none.
category=Display
